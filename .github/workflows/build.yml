name: Build GoPro Importer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore GoProImporter.csproj
      - name: Build
        run: dotnet build GoProImporter.csproj -c Release --no-restore
